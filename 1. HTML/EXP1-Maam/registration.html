<!DOCTYPE html>
<html>

<head>
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Wedding Zone</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="registration.html">Registration</a>
        <a href="login.html">Login</a>
    </nav>

    <div class="box">
        <form onsubmit="return checkForm()" action="thankyou.html">

            <label>First Name</label>
            <input type="text" id="fn" required>

            <label>Last Name</label>
            <input type="text" id="ln" required>

            <label>Mobile Number</label>
            <input type="text" id="mob" required>

            <label>Email</label>
            <input type="text" id="mail" required>

            <label>Password</label>
            <input type="password" id="pass" required>

            <label>Age</label>
            <input type="number" id="age" required>

            <label>Bride/Groom</label><br>

            <input type="radio" name="g" required> Bride
            <input type="radio" name="g"> Groom

            <br><br>

            <label>Services</label><br>

            <input type="checkbox"> Photography
            <input type="checkbox"> Catering
            <input type="checkbox"> Decoration

            <br><br>

            <input type="submit" value="Register">

        </form>
    </div>

    <script src="script.js"></script>

</body>

</html>
