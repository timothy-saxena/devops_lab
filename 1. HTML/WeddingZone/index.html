<!DOCTYPE html>
<html>

<head>
    <title>Wedding Zone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Wedding Zone</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Registration</a>
        <a href="#">Login</a>
    </nav>
    <h2>Registration Form</h2>
    <form action="thankyou.html" onsubmit="return validate()">
        <input type="text" id="fname" placeholder="First Name" required><br>
        <input type="text" id="lname" placeholder="Last Name" required><br>
        <input type="text" id="mobile" placeholder="Mobile Number" required><br>
        <input type="text" id="email" placeholder="Email" required><br>
        <input type="password" id="pass" placeholder="Password" required><br>
        <input type="number" id="age" placeholder="Age" required><br><br>
        Role:
        <input type="radio" name="role">Bride
        <input type="radio" name="role">Groom
        <br><br>
        Preferences:
        <input type="checkbox">Veg
        <input type="checkbox">Photography
        <br><br>
        <input type="submit" value="Register">
    </form>
    <script src="script.js"></script>
</body>

</html>
