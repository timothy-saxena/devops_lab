<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
</head>
<body>
  <h1>Feedback Form</h1>
  <form>
    <label for="name">Name:</label><br>
    <input id="name" name="name" type="text" required><br><br>

    <label for="email">Email:</label><br>
    <input id="email" name="email" type="email" required><br><br>

    <label for="rating">Rating:</label><br>
    <select id="rating" name="rating">
      <option>Excellent</option>
      <option>Good</option>
      <option>Average</option>
      <option>Poor</option>
    </select><br><br>

    <label for="message">Feedback:</label><br>
    <textarea id="message" name="message" rows="5" cols="35" required></textarea><br><br>
    <button type="submit">Submit Feedback</button>
  </form>
</body>
</html>
